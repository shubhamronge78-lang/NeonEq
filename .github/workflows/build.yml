name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.5"

    - name: Run unit tests (preset validation)
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        chmod +x gradlew
        ./gradlew testDebugUnitTest --no-daemon --continue

    - name: Native DSP host self-test (ASan/UBSan)
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        # Single TU: harness.cpp #includes the real neondsp.cpp directly
        g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
          -I tools/dspharness -I . tools/dspharness/harness.cpp \
          -o /tmp/dsp_harness -lpthread
        /tmp/dsp_harness

    - name: Build Debug APK
      working-directory: conversations/6a7a961312b12b330076a6ce/android-eq
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -x test

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: conversations/6a7a961312b12b330076a6ce/android-eq/app/build/outputs/apk/debug/app-debug.apk
