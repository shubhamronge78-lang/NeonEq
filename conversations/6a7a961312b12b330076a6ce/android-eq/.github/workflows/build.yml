name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Get version from git
      id: version
      run: |
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk "NeonEQ-${{ steps.version.outputs.version }}.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NeonEQ-${{ steps.version.outputs.version }}-apk
        path: NeonEQ-${{ steps.version.outputs.version }}.apk
        retention-days: 30
